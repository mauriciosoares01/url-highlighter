<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <h1>URL Highlighter</h1>

      <div id="status">Carregando…</div>

      <label class="toggle">
        <input type="checkbox" id="global-toggle" />
        Ativar highlights
      </label>

      <div class="actions">
        <button type="button" id="create-rule-btn">Criar regra para esta URL</button>
        <button type="button" id="open-options-btn">Abrir configurações completas</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
