<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="popup-header">
        <div class="app-logo">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="3" width="14" height="2" rx="1" fill="white" opacity="0.5" />
            <rect x="1" y="7" width="10" height="6" rx="1" fill="white" />
            <rect x="12" y="7" width="3" height="6" rx="1" fill="white" opacity="0.7" />
          </svg>
        </div>
        <h1>URL Highlighter</h1>
      </header>

      <div id="status" class="status-row">Carregando…</div>

      <div class="toggle-row">
        <span>Ativar highlights</span>
        <button type="button" id="global-toggle" class="toggle-switch" role="switch" aria-checked="false">
          <span class="toggle-knob"></span>
        </button>
      </div>

      <div class="actions">
        <button type="button" id="create-rule-btn" class="btn-primary">Criar regra para essa página</button>
        <button type="button" id="open-options-btn" class="btn-ghost">Abrir configurações completas</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
